<h1>根拠づけの論理を研究する動機</h1>

<p>
    私は根拠づけの論理 (logic of grounding) と呼ばれる分野で研究をしている。だが、学会の懇親会等でその研究をやる動機や意義を聞かれたときに、これまでは、どうもうまく答えられていなかった。しかしながら、根拠づけという概念に関心を持っていて、さらにはありがたいことに私の研究内容にも若干の興味を持って聞いてきてくれている人もいるようなので、うまく答えられないたびに申し訳ない気持ちになっていた。そこでこの記事では、根拠づけの論理の研究が何を目指していて、どういう意義があるのかをまとめてみようと思う。
</p>
